<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebEmail{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #f5f7fb; color: #222; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { position: sticky; top: 0; width: 260px; height: 100vh; flex: 0 0 260px; background: linear-gradient(180deg, #667eea, #764ba2); color: white; padding: 28px 18px; display: flex; flex-direction: column; }
        .logo { color: white; font-size: 27px; font-weight: 700; text-decoration: none; padding: 0 12px 30px; }
        .menu { display: flex; flex-direction: column; gap: 6px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 10px; color: white; text-decoration: none; font-size: 16px; transition: background 0.2s ease, transform 0.2s ease; }
        .menu-item:hover { background: rgba(255, 255, 255, 0.15); transform: translateX(3px); }
        .menu-item.active { background: rgba(255, 255, 255, 0.20); font-weight: 600; }
        .icon { width: 24px; text-align: center; font-size: 18px; }
        .sidebar-bottom { margin-top: auto; padding-top: 25px; }
        .content { flex: 1; min-width: 0; padding: 30px 40px; }
        .page-container { width: 100%; max-width: 1100px; margin: 0 auto; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; background: white; padding: 18px 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05); margin-bottom: 30px; }
        .page-title { margin: 0; color: #174f7a; font-size: 24px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-weight: 700; }
        .user-name { font-weight: 600; }
        .card-panel { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05); }
        .primary-button { display: inline-block; border: 0; border-radius: 8px; background: #2563eb; color: white; padding: 12px 18px; font-size: 14px; font-weight: bold; text-decoration: none; cursor: pointer; }
        .primary-button:hover { background: #1d4ed8; }
        @media (max-width: 700px) { .layout { flex-direction: column; } .sidebar { position: static; width: 100%; height: auto; flex-basis: auto; padding: 15px; } .logo { padding-bottom: 15px; } .menu { flex-direction: row; overflow-x: auto; } .menu-item { white-space: nowrap; } .sidebar-bottom { display: none; } .content { padding: 20px; } .topbar { padding: 15px; } }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <a href="{% url 'user_dashboard' %}" class="logo">WebEmail</a>
            <nav class="menu">
                <a href="{% url 'inbox' %}" class="menu-item {% if request.resolver_match.url_name == 'inbox' or request.resolver_match.url_name == 'message_detail' %}active{% endif %}"><span class="icon">📥</span><span>Kiruvchi xatlar</span></a>
                <a href="{% url 'sent_messages' %}" class="menu-item {% if request.resolver_match.url_name == 'sent_messages' %}active{% endif %}"><span class="icon">📤</span><span>Yuborilgan</span></a>
                <a href="#" class="menu-item"><span class="icon">📝</span><span>Qoralamalar</span></a>
                <a href="#" class="menu-item"><span class="icon">⭐</span><span>Belgilangan</span></a>
                <a href="#" class="menu-item"><span class="icon">📦</span><span>Arxiv</span></a>
                <a href="#" class="menu-item"><span class="icon">🗑</span><span>Chiqindi</span></a>
                <a href="#" class="menu-item"><span class="icon">⚙️</span><span>Profil</span></a>
            </nav>
            <div class="sidebar-bottom"><a href="{% url 'user_logout' %}" class="menu-item"><span class="icon">🚪</span><span>Chiqish</span></a></div>
        </aside>
        <main class="content">
            <div class="page-container">
                <div class="topbar">
                    <h1 class="page-title">{% block page_title %}Bosh sahifa{% endblock %}</h1>
                    <div class="user-info"><div class="avatar">{{ request.user.first_name|first }}</div><div class="user-name">{{ request.user.first_name }} {{ request.user.last_name }}</div></div>
                </div>
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
