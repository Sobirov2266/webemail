<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <title>Xat</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 800px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .back {
            text-decoration: none;
            color: #2563eb;
        }

        h1 {
            margin-top: 25px;
            color: #1f2937;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .info p {
            margin: 8px 0;
        }

        .body {
            margin-top: 30px;
            padding: 20px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

    </style>

</head>

<body>

<div class="container">

    <a href="{% url 'inbox' %}" class="back">
        ← Inboxga qaytish
    </a>

    <h1>
        {% if message.subject %}
            {{ message.subject }}
        {% else %}
            (Mavzusiz)
        {% endif %}
    </h1>

    <div class="info">

        <p>
            <strong>Kimdan:</strong>

            {{ message.sender.first_name }}
            {{ message.sender.last_name }}
        </p>

        <p>
            <strong>Login:</strong>
            {{ message.sender.username }}
        </p>

        <p>
            <strong>Yuborilgan:</strong>
            {{ message.sent_at|date:"d.m.Y H:i" }}
        </p>

    </div>

    <div class="body">
        {{ message.body }}
    </div>

</div>

</body>

</html>
