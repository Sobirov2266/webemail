{% extends "base_admin.html" %}

{% block title %}Bo‘lim yaratish — WebEmail{% endblock %}

{% block content %}
<div class="panel panel-pad" style="max-width: 560px;">
    <p class="page-kicker">{{ organization.name }}</p>
    <h1 class="page-title" style="margin-bottom: 24px;">Bo‘lim yaratish</h1>

    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label>Bo‘lim nomi</label>
            <input type="text" name="name" required>
        </div>
        <div class="field">
            <label>Tavsif</label>
            <textarea name="description" style="min-height: 100px;"></textarea>
        </div>
        <div class="actions">
            <a href="{% url 'organization_detail' organization.id %}" class="btn btn-secondary">Bekor qilish</a>
            <button type="submit" class="btn">Saqlash</button>
        </div>
    </form>
</div>
{% endblock %}
