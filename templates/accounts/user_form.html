{% load static %}

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xodim yaratish — WebEmail</title>

    <link rel="stylesheet" href="{% static 'accounts/admin_dashboard.css' %}">
</head>

<body>

<header class="header">

    <h2>WebEmail</h2>

    <a href="{% url 'department_detail' department.id %}">
        ← Orqaga
    </a>

</header>

<main class="container">

    <div class="form-container">

        <h1>Xodim yaratish</h1>

        <p>
            Tashkilot:
            <strong>{{ department.organization.name }}</strong>
        </p>

        <p>
            Bo'lim:
            <strong>{{ department.name }}</strong>
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label>Ism</label>
                <input
                    type="text"
                    name="first_name"
                    required
                    placeholder="Ismni kiriting"
                >
            </div>

            <div class="form-group">
                <label>Familiya</label>
                <input
                    type="text"
                    name="last_name"
                    required
                    placeholder="Familiyani kiriting"
                >
            </div>

            <div class="form-group">
                <label>Login</label>
                <input
                    type="text"
                    name="username"
                    required
                    placeholder="Loginni kiriting"
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="email@example.com"
                >
            </div>

            <div class="form-group">
                <label>Lavozim</label>
                <input
                    type="text"
                    name="position"
                    placeholder="Lavozimni kiriting"
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Xodimni yaratish
                </button>

                <a href="{% url 'department_detail' department.id %}" class="btn btn-secondary">
                    Bekor qilish
                </a>
            </div>

        </form>

    </div>

</main>

</body>
</html>
