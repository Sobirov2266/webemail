{% extends "base_admin.html" %}

{% block title %}Xodim yaratish — WebEmail{% endblock %}

{% block content %}
<div class="panel panel-pad" style="max-width: 560px;">
    <p class="page-kicker">{{ department.organization.name }} · {{ department.name }}</p>
    <h1 class="page-title" style="margin-bottom: 24px;">Xodim yaratish</h1>

    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label>Ism</label>
            <input type="text" name="first_name" required>
        </div>
        <div class="field">
            <label>Familiya</label>
            <input type="text" name="last_name" required>
        </div>
        <div class="field">
            <label>Login</label>
            <input type="text" name="username" required>
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" name="email">
        </div>
        <div class="field">
            <label>Lavozim</label>
            <input type="text" name="position">
        </div>
        <div class="actions">
            <a href="{% url 'department_detail' department.id %}" class="btn btn-secondary">Bekor qilish</a>
            <button type="submit" class="btn">Saqlash</button>
        </div>
    </form>
</div>
{% endblock %}
