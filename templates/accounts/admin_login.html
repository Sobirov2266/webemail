{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebEmail — Admin kirish</title>
    <link rel="stylesheet" href="{% static 'webemail/app.css' %}">
</head>
<body class="auth-compact">
<div class="auth-card">
    <p class="page-kicker">Administrator</p>
    <h2>Tizimga kirish</h2>
    <p class="lede">Faqat superuser hisobi qabul qilinadi.</p>

    {% if error %}
        <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label for="username">Login</label>
            <input id="username" name="username" type="text" required autocomplete="username">
        </div>
        <div class="field">
            <label for="password">Parol</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-block">Kirish</button>
    </form>
</div>
</body>
</html>
