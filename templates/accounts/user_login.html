{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebEmail — Kirish</title>
    <link rel="stylesheet" href="{% static 'webemail/app.css' %}">
</head>
<body>
<div class="auth-page">
    <section class="auth-brand">
        <div class="auth-mark">WebEmail <span>Mail</span></div>
        <div class="auth-copy">
            <h1>Tashkilot ichidagi xatlar uchun tinch ish maydoni.</h1>
            <p>Kirish shaxsiy kalit fayli orqali amalga oshiriladi. Parol kiritish shart emas.</p>
        </div>
        <div class="auth-meta">Faqat berilgan .key fayl bilan kiring.</div>
    </section>

    <section class="auth-panel">
        <div class="auth-card">
            <h2>Kirish</h2>
            <p class="lede">ERI kalit faylini tanlang, keyin tizimga kiring.</p>

            <label for="keyFile" class="dropzone">
                <strong>Kalit faylini tanlang</strong>
                <span>Faqat .key format qabul qilinadi</span>
                <input type="file" id="keyFile" accept=".key">
            </label>

            <div class="status-box" id="statusBox">Fayl tanlanmagan</div>

            <button type="button" class="btn btn-block" id="loginButton" disabled style="margin-top: 18px;">
                Kirish
            </button>
        </div>
    </section>
</div>

<script>
    const keyFile = document.getElementById("keyFile");
    const statusBox = document.getElementById("statusBox");
    const loginButton = document.getElementById("loginButton");

    function pemToArrayBuffer(pem) {
        const base64 = pem
            .replace("-----BEGIN PRIVATE KEY-----", "")
            .replace("-----END PRIVATE KEY-----", "")
            .replace(/\s/g, "");

        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);

        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }

        return bytes.buffer;
    }

    async function importPrivateKey(pem) {
        const keyData = pemToArrayBuffer(pem);
        return crypto.subtle.importKey(
            "pkcs8",
            keyData,
            { name: "Ed25519" },
            false,
            ["sign"]
        );
    }

    keyFile.addEventListener("change", function () {
        if (this.files.length === 0) {
            statusBox.textContent = "Fayl tanlanmagan";
            statusBox.className = "status-box";
            loginButton.disabled = true;
            return;
        }

        const file = this.files[0];

        if (!file.name.toLowerCase().endsWith(".key")) {
            statusBox.textContent = "Faqat .key fayl tanlang";
            statusBox.className = "status-box bad";
            loginButton.disabled = true;
            return;
        }

        statusBox.textContent = file.name;
        statusBox.className = "status-box ok";
        loginButton.disabled = false;
    });

    loginButton.addEventListener("click", async function () {
        if (keyFile.files.length === 0) {
            return;
        }

        try {
            const file = keyFile.files[0];
            const fileContent = await file.text();
            const keyIdMatch = fileContent.match(/Key ID:\s*([a-f0-9-]+)/i);

            if (!keyIdMatch) {
                alert("Key ID topilmadi.");
                return;
            }

            const keyId = keyIdMatch[1];
            const privateKeyMatch = fileContent.match(
                /-----BEGIN PRIVATE KEY-----[\s\S]+?-----END PRIVATE KEY-----/
            );

            if (!privateKeyMatch) {
                alert("Private key topilmadi.");
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Kalit tayyorlanmoqda...";

            const privateKey = await importPrivateKey(privateKeyMatch[0]);
            loginButton.textContent = "Tasdiqlanmoqda...";

            const formData = new URLSearchParams();
            formData.append("key_id", keyId);

            const challengeResponse = await fetch(
                "{% url 'create_login_challenge' %}",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: formData
                }
            );

            const challengeData = await challengeResponse.json();

            if (!challengeData.success) {
                alert(challengeData.message);
                loginButton.disabled = false;
                loginButton.textContent = "Kirish";
                return;
            }

            const challenge = challengeData.challenge;
            const encoder = new TextEncoder();
            const signature = await crypto.subtle.sign(
                { name: "Ed25519" },
                privateKey,
                encoder.encode(challenge)
            );

            const signatureBytes = new Uint8Array(signature);
            let binaryString = "";
            for (let i = 0; i < signatureBytes.length; i++) {
                binaryString += String.fromCharCode(signatureBytes[i]);
            }
            const signatureBase64 = btoa(binaryString);

            loginButton.textContent = "Tekshirilmoqda...";

            const verifyData = new URLSearchParams();
            verifyData.append("key_id", keyId);
            verifyData.append("challenge", challenge);
            verifyData.append("signature", signatureBase64);

            const verifyResponse = await fetch(
                "{% url 'verify_login_signature' %}",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: verifyData
                }
            );

            const verifyResult = await verifyResponse.json();

            if (!verifyResult.success) {
                alert(verifyResult.message);
                loginButton.disabled = false;
                loginButton.textContent = "Kirish";
                return;
            }

            window.location.href = "{% url 'user_dashboard' %}";
        } catch (error) {
            alert("Kalit yoki imzo bilan xatolik.\n\n" + error.message);
            loginButton.disabled = false;
            loginButton.textContent = "Kirish";
        }
    });
</script>
</body>
</html>
