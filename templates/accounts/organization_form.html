{% extends "base_admin.html" %}

{% block title %}Tashkilot yaratish — WebEmail{% endblock %}

{% block content %}
<div class="panel panel-pad" style="max-width: 560px;">
    <p class="page-kicker">Tuzilma</p>
    <h1 class="page-title" style="margin-bottom: 24px;">Tashkilot yaratish</h1>

    {% if error %}
        <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label>Tashkilot nomi</label>
            <input type="text" name="name" required>
        </div>
        <div class="field">
            <label>INN</label>
            <input type="text" name="inn" required maxlength="9" pattern="[0-9]{9}" title="INN 9 xonali raqam">
        </div>
        <div class="field">
            <label>Tavsif</label>
            <textarea name="description" style="min-height: 100px;"></textarea>
        </div>
        <div class="actions">
            <a href="{% url 'organization_list' %}" class="btn btn-secondary">Bekor qilish</a>
            <button type="submit" class="btn">Saqlash</button>
        </div>
    </form>
</div>
{% endblock %}
